name: Render Claude Code Reel (HeyGen Hyperframes)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2

      - name: Install Hyperframes & Dependencies
        run: |
          npm install -g hyperframes
          npm install puppeteer-core

      - name: Run Layout Diagnostic (t=1.0s)
        run: |
          node diagnose.js

      - name: Upload Diagnostic Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose_screenshot
          path: diagnose_screenshot_1s.png
          if-no-files-found: ignore

      - name: Render Video Studio Master (Deterministic CDP Engine)
        run: |
          echo "=== Starting High-Fidelity CDP Deterministic Render ==="
          node render_cdp.js

          # Verify Audio Track
          if [ -f Claude_Code_Master_Reel.mp4 ]; then
            HAS_AUDIO=$(ffprobe -i Claude_Code_Master_Reel.mp4 -show_streams -select_streams a -loglevel error)
            if [ -z "$HAS_AUDIO" ] && [ -f master_audio.mp3 ]; then
              echo "Muxing master_audio.mp3 into final video..."
              ffmpeg -y -i Claude_Code_Master_Reel.mp4 -i master_audio.mp3 -c:v copy -c:a aac -b:a 192k -shortest output_muxed.mp4
              mv output_muxed.mp4 Claude_Code_Master_Reel.mp4
            fi
            echo "=== Final Video Details ==="
            ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of default=noprint_wrappers=1 Claude_Code_Master_Reel.mp4
            ls -lh Claude_Code_Master_Reel.mp4
          else
            echo "Error: Video could not be produced."
            exit 1
          fi

      - name: Upload Frame 1s Verification Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final_video_frame_1s
          path: final_video_frame_1s.png
          if-no-files-found: ignore

      - name: Upload Final MP4 Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Claude_Code_Master_Reel
          path: Claude_Code_Master_Reel.mp4
          if-no-files-found: error
